# **Name**
# CI - Reusable workflow

# **Overview**
# This workflow runs the build and test jobs for various Node versions.
# Continuously integrating the project ensures that the codebase is always working.

# **When**
# Other workflows trigger this workflow.
# Any events do not trigger it.

name: CI
on:
  workflow_call:
    inputs:
      test-needed:
        description: "Set to false if the test step is not needed."
        required: false
        type: boolean
        default: true
      install-legacy-peer-deps:
        description: "Set to true if the legacy-peer-deps flag is needed."
        required: false
        type: boolean
        default: false

# Define the jobs that are called by other workflows.
jobs:
  build:
    name: "Test: Node ${{ matrix.node_version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
      - name: Set Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          registry-url: https://registry.npmjs.org/
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: ./package.json
      - name: Install legacy dependencies
        if: ${{ inputs.install-legacy-peer-deps == true }}
        run: npm install --legacy-peer-deps
      - name: Install dependencies
        if: ${{ inputs.install-legacy-peer-deps == false }}
        run: npm install
      - name: Run tests
        if: ${{ inputs.test-needed == true }}
        run: npm test

